<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>အေးချမ်းသော မြန်မာအသံ (Peaceful Myanmar Voice)</title>
  <style>
    :root {
      --bg-gradient-start: #e0f2f1;
      --bg-gradient-end: #b2dfdb;
      --text-color: #004d40;
      --box-bg: rgba(255, 255, 255, 0.9);
      --button-color: #26a69a;
      --button-hover: #00897b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: var(--box-bg);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 77, 64, 0.15);
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 600;
    }

    .settings-group {
      background: #ffffff;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    }

    label {
      display: block;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #00695c;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #b2dfdb;
      background: #f1f8f7;
      font-family: inherit;
      font-size: 1rem;
      color: #004d40;
      margin-bottom: 15px;
      outline: none;
    }

    /* လူသံပိုတူအောင် ချိန်ညှိဖို့ Slider များ */
    .slider-container {
      margin-bottom: 10px;
    }
    
    input[type="range"] {
      width: 100%;
      accent-color: var(--button-color);
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      border: 2px solid transparent;
      border-radius: 16px;
      background: #fafafa;
      color: #004d40;
      font-family: inherit;
      font-size: 1.1rem;
      resize: none;
      outline: none;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    textarea:focus {
      border-color: var(--button-hover);
      background: #ffffff;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      font-family: inherit;
      font-size: 1rem;
      padding: 12px 20px;
      border: none;
      border-radius: 50px;
      background-color: var(--button-color);
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(38, 166, 154, 0.3);
      transition: all 0.3s ease;
      flex: 1;
      min-width: 120px;
    }

    button:hover {
      background-color: var(--button-hover);
      transform: translateY(-2px);
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #downloadBtn {
      background-color: #ffb74d;
      box-shadow: 0 4px 15px rgba(255, 183, 77, 0.3);
      display: none; /* အသံဖတ်ပြီးမှ ပေါ်လာမယ် */
    }

    #downloadBtn:hover {
      background-color: #ffa726;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>🎧 အေးချမ်းသော မြန်မာအသံ</h1>

    <!-- အသံ ရွေးချယ်ခြင်းနှင့် ချိန်ညှိခြင်း -->
    <div class="settings-group">
      <label for="voiceSelect">အသံ ရွေးချယ်ပါ -</label>
      <select id="voiceSelect"></select>

      <div class="slider-container">
        <label>အသံအမြန်နှုန်း (နှေးချင်ရင် ဘယ်ဘက်ကို ဆွဲပါ) - <span id="rateVal">0.9</span></label>
        <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.9">
      </div>

      <div class="slider-container">
        <label>အသံအနိမ့်အမြင့် - <span id="pitchVal">1.0</span></label>
        <input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1.0">
      </div>
    </div>

    <textarea id="textInput" placeholder="ဒီနေရာမှာ မြန်မာစာ ရိုက်ထည့်ပါ..."></textarea>

    <div class="button-group">
      <button id="speakBtn" onclick="speakText()">🎧 အသံဖတ်မည်</button>
      <button id="stopBtn" onclick="stopText()" style="background-color: #e0e0e0; color: #666; box-shadow: none;">⏹ ရပ်မည်</button>
    </div>
    
    <!-- ဒေါင်းလုဒ် ခလုတ် -->
    <div style="margin-top: 15px;">
        <button id="downloadBtn" onclick="downloadAudio()">💾 အသံဖိုင် သိမ်းမည်</button>
    </div>
  </div>

  <script>
    const synth = window.speechSynthesis;
    let voices = [];
    let currentUtterance = null;
    let audioBlob = null; // ဒေါင်းလုဒ်အတွက် သိမ်းထားမယ့် နေရာ

    const voiceSelect = document.getElementById('voiceSelect');
    const rateInput = document.getElementById('rate');
    const pitchInput = document.getElementById('pitch');
    const rateVal = document.getElementById('rateVal');
    const pitchVal = document.getElementById('pitchVal');
    const speakBtn = document.getElementById('speakBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // Slider တွေရွှေ့ရင် နံပါတ်ပြောင်းပြရန်
    rateInput.oninput = () => rateVal.innerText = rateInput.value;
    pitchInput.oninput = () => pitchVal.innerText = pitchInput.value;

    // ဖုန်းထဲက အသံတွေကို ဆွဲထုတ်ခြင်း
    function populateVoices() {
      voices = synth.getVoices();
      voiceSelect.innerHTML = '';
      
      // မြန်မာအသံကို အရင်ရှာမယ်
      let mmVoices = voices.filter(v => v.lang.includes('my') || v.lang.includes('MY'));
      
      // တကယ်လို့ မြန်မာအသံ မရှိရင် အားလုံးကို ပြမယ်
      let voicesToShow = mmVoices.length > 0 ? mmVoices : voices;

      if (voicesToShow.length === 0) {
        voiceSelect.innerHTML = '<option>ဖုန်းထဲမှာ အသံ မရှိသေးပါ</option>';
      }

      voicesToShow.forEach((voice, index) => {
        let option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;
        // မြန်မာအသံကို Default ရွေးထားမယ်
        if (voice.lang.includes('my') || voice.lang.includes('MY')) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      });
    }

    // အသံစာရင်း Load ဖြစ်တာနဲ့ ခေါ်မယ်
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoices;
    }
    populateVoices();

    // စာသားဖတ်ခြင်း
    function speakText() {
      const text = document.getElementById('textInput').value;
      if (text.trim() === '') {
        alert('အသံဖတ်ဖို့အတွက် စာသား အရင်ရိုက်ထည့်ပါဦး။');
        return;
      }

      stopText(); // အရင်ဖတ်နေတာရှိရင် ရပ်မယ်
      downloadBtn.style.display = 'none'; // ဒေါင်းလုဒ်ခလုတ်ကို ဖျောက်ထားမယ်

      currentUtterance = new SpeechSynthesisUtterance(text);
      
      // ရွေးထားတဲ့ အသံကို သတ်မှတ်မယ်
      const selectedVoiceIndex = voiceSelect.value;
      if (voices.length > 0 && selectedVoiceIndex !== '') {
          currentUtterance.voice = voices[selectedVoiceIndex] || voices.find(v => v.lang.includes('my'));
      }
      
      currentUtterance.rate = parseFloat(rateInput.value);
      currentUtterance.pitch = parseFloat(pitchInput.value);

      speakBtn.disabled = true;
      speakBtn.innerHTML = '🗣️ ဖတ်နေသည်...';

      // ဖတ်ပြီးသွားရင်
      currentUtterance.onend = function() {
        speakBtn.disabled = false;
        speakBtn.innerHTML = '🎧 အသံဖတ်မည်';
        // ဒေါင်းလုဒ်ခလုတ်ကို ပြမယ်
        downloadBtn.style.display = 'block'; 
      };

      currentUtterance.onerror = function(event) {
        console.error(event);
        alert('အသံဖတ်လို့ မရဖြစ်နေပါတယ်။ ဖုန်း Settings မှာ မြန်မာ Text-to-Speech သွင်းထားဖို့ လိုပါတယ်။');
        speakBtn.disabled = false;
        speakBtn.innerHTML = '🎧 အသံဖတ်မည်';
      };

      synth.speak(currentUtterance);
    }

    function stopText() {
      if (synth.speaking) {
        synth.cancel();
        speakBtn.disabled = false;
        speakBtn.innerHTML = '🎧 အသံဖတ်မည်';
      }
    }

    // အသံဖိုင် (Audio File) အဖြစ် သိမ်းဆည်းခြင်း
    // မှတ်ချက် - Browser အများစုမှာ Speech Synthesis ကို တိုက်ရိုက် ဖိုင်အဖြစ် ဆွဲချဖို့ ခက်ခဲပါတယ်။ 
    // ဒါကြောင့် အကောင်းဆုံးနည်းလမ်းဖြစ်တဲ့ MediaRecorder နည်းပညာကို သုံးပြီး ဖုန်း Microphone ကတစ်ဆင့် ပြန်အသံသွင်းတဲ့ နည်းကို အသုံးပြုထားပါတယ်။
    async function downloadAudio() {
        const text = document.getElementById('textInput').value;
        if(!text) return;

        // ဒေါင်းလုဒ်လုပ်ရာမှာ ဖုန်းရဲ့ Speaker အသံကို ဖမ်းယူဖို့ ခွင့်ပြုချက်တောင်းပါမယ်
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            const audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const audioUrl = URL.createObjectURL(audioBlob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = audioUrl;
                a.download = 'myanmar_voice.wav';
                document.body.appendChild(a);
                a.click();
                URL.revokeObjectURL(audioUrl);
                stream.getTracks().forEach(track => track.stop()); // မိုက်ပိတ်
            };

            mediaRecorder.start();
            speakText(); // အသံစတင်ဖတ်မယ်

            // ဖတ်ပြီးတဲ့အထိ စောင့်ပြီး သွင်းယူမယ်
            currentUtterance.onend = function() {
                setTimeout(() => {
                    mediaRecorder.stop();
                    speakBtn.disabled = false;
                    speakBtn.innerHTML = '🎧 အသံဖတ်မည်';
                }, 500); 
            };

        } catch (err) {
            alert("ဒေါင်းလုဒ်လုပ်ရန် မိုက်ခရိုဖုန်း အသုံးပြုခွင့် (Microphone Permission) ပြုပြင်ပေးဖို့ လိုအပ်ပါတယ်။ (Speaker မှတစ်ဆင့် အသံကို ပြန်ဖမ်းယူသောကြောင့်ပါ)");
            console.error(err);
        }
    }
  </script>
</body>
</html>
