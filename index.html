<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joseph | Developer Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* --- CSS VARIABLES --- */
    :root {
      --bg-color: #0a0a0c;
      --text-main: #f0f0f5;
      --text-muted: #888890;
      --electric-blue: #007BFF;
      --electric-blue-glow: rgba(0, 123, 255, 0.6);
      --card-bg: #121216;
      --border-color: #2a2a35;
      --font-mono: 'Fira Code', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    /* --- BASE STYLES --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* --- HIGHLY ANIMATED BACKGROUND --- */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(rgba(0, 123, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 123, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -2;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(30px); }
    }

    /* Glowing orb following mouse/center */
    .glow-orb {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--electric-blue-glow) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      z-index: -1;
      opacity: 0.4;
      animation: pulseOrb 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseOrb {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.6; }
    }

    /* --- MAIN CONTAINER --- */
    .container {
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* --- PROFILE HEADER --- */
    .profile {
      text-align: center;
      animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      margin: 0 auto 1rem;
      background-color: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 2rem;
      color: var(--electric-blue);
      position: relative;
      transition: all 0.3s ease;
    }

    .avatar::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--electric-blue);
      border-bottom-color: var(--electric-blue);
      animation: spin 3s linear infinite;
    }

    .avatar:hover {
      box-shadow: 0 0 20px var(--electric-blue-glow);
      transform: scale(1.05);
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    /* Typing Effect */
    .typewriter {
      font-family: var(--font-mono);
      color: var(--electric-blue);
      font-size: 0.9rem;
      overflow: hidden;
      white-space: nowrap;
      margin: 0 auto;
      border-right: 2px solid var(--electric-blue);
      width: 0;
      animation: 
        typing 3s steps(30, end) forwards,
        blinkCaret 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blinkCaret {
      from, to { border-color: transparent }
      50% { border-color: var(--electric-blue); }
    }

    /* --- LINKS --- */
    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      padding: 1rem 1.5rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 1rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    /* Staggered Animation Delays */
    .link-card:nth-child(1) { animation-delay: 0.1s; }
    .link-card:nth-child(2) { animation-delay: 0.2s; }

    /* Electric Blue Border Fill Animation */
    .link-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background-color: var(--electric-blue);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.3s ease;
    }

    .link-card:hover {
      border-color: var(--electric-blue);
      box-shadow: 0 0 15px rgba(0, 123, 255, 0.2);
      transform: translateX(5px);
    }

    .link-card:hover::before {
      transform: scaleY(1);
    }

    .link-icon {
      width: 24px;
      height: 24px;
      margin-right: 1rem;
      fill: var(--text-muted);
      transition: fill 0.3s ease, transform 0.3s ease;
    }

    .link-card:hover .link-icon {
      fill: var(--electric-blue);
      transform: scale(1.1);
    }

    .link-text {
      flex-grow: 1;
    }

    .arrow {
      color: var(--text-muted);
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .link-card:hover .arrow {
      color: var(--electric-blue);
      transform: translateX(5px);
    }

    /* --- ANIMATIONS --- */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>

  <!-- Background Animations -->
  <div class="bg-grid"></div>
  <div class="glow-orb" id="glowOrb"></div>

  <div class="container">
    
    <!-- Profile Section -->
    <header class="profile">
      <div class="avatar">
        { J }
      </div>
      <h1>@Joseph12jino</h1>
      <div class="typewriter">Building the future...</div>
    </header>

    <!-- Social Links Section -->
    <main class="links">
      
      <!-- Telegram Link -->
      <a href="https://t.me/Joseph12jino" target="_blank" rel="noopener noreferrer" class="link-card">

        <span class="link-text">Telegram</span>
        <span class="arrow">→</span>
      </a>

      <!-- GitHub Link -->
      <a href="https://github.com/dio123456778-code" target="_blank" rel="noopener noreferrer" class="link-card">
        <!-- GitHub SVG Icon -->
        <svg class="link-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        <span class="link-text">GitHub</span>
        <span class="arrow">→</span>
      </a>

    </main>
  </div>

  <!-- Script for Interactive Glow Effect -->
  <script>
    document.addEventListener('mousemove', (e) => {
      const orb = document.getElementById('glowOrb');
      const x = e.clientX;
      const y = e.clientY;
      
      orb.style.left = `${x}px`;
      orb.style.top = `${y}px`;
    });
    
    // Keep glow centered on mobile devices
    if ('ontouchstart' in window) {
      const orb = document.getElementById('glowOrb');
      orb.style.left = '50%';
      orb.style.top = '50%';
    }
  </script>
</body>
</html>
